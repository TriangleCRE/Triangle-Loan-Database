<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="640" height="140" fill="#ffffff"/>

  <!-- Pin button -->
  <rect x="16" y="40" width="76" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="54" y="62" text-anchor="middle" font-size="13" fill="#24292f">📌 Pin</text>

  <!-- Watch/notifications dropdown button (the one to click) -->
  <rect x="100" y="40" width="168" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="116" y="62" font-size="13" fill="#24292f">🔔 Stop ignoring</text>
  <rect x="238" y="47" width="20" height="20" rx="10" fill="#eaeef2"/>
  <text x="248" y="61" text-anchor="middle" font-size="11" fill="#24292f">0</text>
  <text x="112" y="90" font-size="11" fill="#57606a"> </text>
  <polygon points="262,58 268,58 265,63" fill="#57606a"/>

  <!-- Fork button -->
  <rect x="276" y="40" width="86" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="290" y="62" font-size="13" fill="#24292f">⑂ Fork</text>
  <rect x="330" y="47" width="20" height="20" rx="10" fill="#eaeef2"/>
  <text x="340" y="61" text-anchor="middle" font-size="11" fill="#24292f">0</text>

  <!-- Star button -->
  <rect x="370" y="40" width="86" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="384" y="62" font-size="13" fill="#24292f">☆ Star</text>
  <rect x="424" y="47" width="20" height="20" rx="10" fill="#eaeef2"/>
  <text x="434" y="61" text-anchor="middle" font-size="11" fill="#24292f">0</text>

  <!-- Highlight box + callout around the notifications button -->
  <rect x="94" y="34" width="180" height="46" rx="8" fill="none" stroke="#cf222e" stroke-width="2.5"/>
  <path d="M 184 80 L 184 108" stroke="#cf222e" stroke-width="2"/>
  <polygon points="184,112 179,102 189,102" fill="#cf222e"/>
  <rect x="118" y="112" width="132" height="24" rx="4" fill="#cf222e"/>
  <text x="184" y="129" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Click this dropdown</text>
</svg>
