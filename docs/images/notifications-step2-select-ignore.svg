<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="620" height="430" fill="#ffffff"/>

  <!-- dropdown card -->
  <rect x="20" y="20" width="580" height="390" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Option 1: Participating and @mentions -->
  <text x="44" y="58" font-size="15" font-weight="600" fill="#24292f">Participating and @mentions</text>
  <text x="44" y="80" font-size="12" fill="#57606a">Only receive notifications from this repository when</text>
  <text x="44" y="97" font-size="12" fill="#57606a">participating or @mentioned.</text>
  <line x1="20" y1="118" x2="600" y2="118" stroke="#d0d7de" stroke-width="1"/>

  <!-- Option 2: All Activity -->
  <text x="44" y="150" font-size="15" font-weight="600" fill="#24292f">All Activity</text>
  <text x="44" y="172" font-size="12" fill="#57606a">Notified of all notifications on this repository.</text>
  <line x1="20" y1="193" x2="600" y2="193" stroke="#d0d7de" stroke-width="1"/>

  <!-- Option 3: Ignore (the one to pick) -->
  <text x="76" y="230" font-size="16" font-weight="700" fill="#24292f">✓ Ignore</text>
  <text x="76" y="252" font-size="12" fill="#57606a">Never be notified.</text>
  <line x1="20" y1="273" x2="600" y2="273" stroke="#d0d7de" stroke-width="1"/>

  <!-- Option 4: Custom -->
  <text x="44" y="308" font-size="15" font-weight="600" fill="#24292f">Custom</text>
  <text x="562" y="308" font-size="15" fill="#57606a">→</text>
  <text x="44" y="330" font-size="12" fill="#57606a">Select events you want to be notified of in</text>
  <text x="44" y="347" font-size="12" fill="#57606a">addition to participating and @mentions.</text>

  <!-- Highlight box around Ignore row -->
  <rect x="30" y="205" width="560" height="60" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>

  <!-- Callout -->
  <path d="M 590 235 L 615 235" stroke="#cf222e" stroke-width="2"/>
  <polygon points="620,235 610,230 610,240" fill="#cf222e"/>

  <rect x="60" y="10" width="220" height="24" rx="4" fill="#cf222e"/>
  <text x="170" y="27" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Select "Ignore" here</text>
</svg>
